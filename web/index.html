<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Watch the Destiny 2 players you suspect of cheating and see when they are in a PvP match, so you can queue while they are busy." />
    <title>Queue Radar</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <main class="min-h-screen bg-ground px-4 py-12 text-ink">
        <h1 class="macro text-6xl">Queue Radar</h1>
        <p class="mt-6 max-w-xl text-lg">Watch the players you suspect of cheating, see when they are in a match, and queue while they are busy.</p>
        <div data-ui class="tele mt-8 grid max-w-3xl grid-cols-2 gap-px bg-line md:grid-cols-4" aria-label="Sample board with made-up players">
          <div class="bg-ground p-3"><p class="text-dim">IN MATCH</p><p class="mt-2 bg-surface p-2 shadow-edge">Rook#2093<br />TRIALS OF OSIRIS · BURNOUT 04:12</p></div>
          <div class="bg-ground p-3"><p class="text-dim">QUEUING?</p><p class="mt-2 bg-surface p-2">Mire#3307<br />ORBIT · COMPETITIVE ENDED 1M AGO</p></div>
          <div class="bg-ground p-3"><p class="text-dim">NOT IN PVP</p><p class="mt-2 bg-surface p-2">Kestrel#0412<br />ORBIT · LAST PVP 1H</p></div>
          <div class="bg-ground p-3"><p class="text-dim">OFFLINE</p><p class="mt-2 bg-surface p-2 text-dim">Tallow#5510<br />OFFLINE · LAST PVP 2D</p></div>
        </div>
        <a href="/auth/login" class="mt-8 inline-block bg-accent px-6 py-4 font-semibold text-ground">Sign in with Bungie</a>
        <p class="mt-12 text-sm text-dim">Queue Radar is not affiliated with or endorsed by Bungie. The dashboard needs JavaScript.</p>
      </main>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
