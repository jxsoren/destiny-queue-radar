<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="See when the Destiny 2 players you follow are in a PvP match." />
    <title>Queue Radar</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <main class="mist min-h-screen px-4 py-12 text-white">
        <h1 class="t-name on-mist text-5xl">Queue Radar</h1>
        <p class="t-type on-mist mt-2">Crucible Reconnaissance</p>
        <p class="t-flavor on-mist mt-4">“You are not hidden.”</p>
        <p class="on-mist mt-6 max-w-xl text-lg">See when the players you follow are in a PvP match.</p>
        <div data-ui class="mt-8 grid max-w-3xl gap-4 md:grid-cols-4" aria-label="Sample board with made-up players">
          <div><p class="t-head on-mist">IN MATCH</p><p class="banner-card is-live mt-2 p-3 pl-6 text-sm">Rook#2093<br />TRIALS OF OSIRIS · BURNOUT 04:12</p></div>
          <div><p class="t-head on-mist">QUEUING</p><p class="banner-card mt-2 p-3 pl-6 text-sm">Mire#3307<br />ORBIT · COMPETITIVE ENDED 1M AGO</p></div>
          <div><p class="t-head on-mist">NOT IN PVP</p><p class="banner-card mt-2 p-3 pl-6 text-sm">Kestrel#0412<br />ORBIT · LAST PVP 1H</p></div>
          <div><p class="t-head on-mist">OFFLINE</p><p class="banner-card is-muted mt-2 p-3 pl-6 text-sm">Tallow#5510<br />OFFLINE · LAST PVP 2D</p></div>
        </div>
        <a href="/auth/login" class="btn-primary mt-8">Sign in with Bungie</a>
        <p class="on-mist mt-12 text-sm">Queue Radar is not affiliated with or endorsed by Bungie. The dashboard needs JavaScript.</p>
      </main>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
